<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCFF - Dashboard Análise de Atendimentos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0D4680 0%, #1a5fa0 100%);
            padding: 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(13, 70, 128, 0.5) 25%, rgba(13, 70, 128, 0.5) 26%, transparent 27%, transparent 74%, rgba(13, 70, 128, 0.5) 75%, rgba(13, 70, 128, 0.5) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(13, 70, 128, 0.5) 25%, rgba(13, 70, 128, 0.5) 26%, transparent 27%, transparent 74%, rgba(13, 70, 128, 0.5) 75%, rgba(13, 70, 128, 0.5) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .header { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(13, 70, 128, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .header h1 { color: #333; margin-bottom: 5px; font-size: 32px; text-align: center; }
        .form-card { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(13, 70, 128, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s ease;
        }
        
        button:hover::before {
            left: 100%;
        }
        .btn-submit { 
            background: linear-gradient(135deg, #0D4680 0%, #1a5fa0 100%);
            color: white; 
            width: 100%;
            box-shadow: 0 4px 15px rgba(13, 70, 128, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-submit:hover { 
            background: linear-gradient(135deg, #1a5fa0 0%, #0D4680 100%);
            box-shadow: 0 6px 20px rgba(13, 70, 128, 0.4);
            transform: translateY(-2px);
        }
        .btn-back { background: #f5f5f5; color: #333; margin-bottom: 20px; width: auto; }
        .btn-add { background: #2ed573; color: white; padding: 10px 20px; margin-top: 10px; }
        .error { background: #fee; color: #c33; padding: 15px; border-radius: 4px; margin: 10px 0; border-left: 4px solid #f44; }
        .success { background: #efe; color: #3a3; padding: 15px; border-radius: 4px; margin: 10px 0; }
        .hidden { display: none !important; }
        .dashboard { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(13, 70, 128, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }
        
        .dashboard::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #667eea, transparent);
            border-radius: 8px 8px 0 0;
        }
        .dashboard h2 { color: #333; margin-bottom: 15px; border-bottom: 2px solid #667eea; padding-bottom: 10px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        @media (max-width: 768px) { .stats { grid-template-columns: 1fr; } }
        .stat-box {
            background: linear-gradient(135deg, #0D4680 0%, #1a5fa0 100%);
            color: white;
            padding: 20px;
            border-radius: 6px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(13, 70, 128, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .stat-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 0%, rgba(255, 255, 255, 0.05) 50%, transparent 100%);
            pointer-events: none;
        }
        .stat-number { font-size: 32px; font-weight: bold; }
        .stat-label { font-size: 14px; margin-top: 5px; }
        .stat-percent { font-size: 20px; margin-top: 10px; font-weight: bold; }
        .meta-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .meta-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; align-items: center; }
        @media (max-width: 1024px) { .meta-row { grid-template-columns: 1fr 1fr; } }
        .meta-input { padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .indicador {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .indicador.verde { background: #2ed573; }
        .indicador.amarelo { background: #ff9f43; }
        .indicador.vermelho { background: #f44; }
        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 1024px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
        }
        .chart-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            position: relative;
            height: 600px;
            box-shadow: 0 8px 32px rgba(13, 70, 128, 0.3);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .chart-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #667eea, transparent);
            border-radius: 8px 8px 0 0;
        }
        .chart-box h3 { color: #333; margin-bottom: 15px; font-size: 16px; flex-shrink: 0; }
        .chart-canvas-wrapper {
            position: relative;
            height: 420px;
            flex-shrink: 0;
        }
        .historico-list {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(13, 70, 128, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .historico-item {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, rgba(13, 70, 128, 0.05) 0%, transparent 100%);
            transition: all 0.3s ease;
        }
        
        .historico-item:hover {
            background: linear-gradient(90deg, rgba(13, 70, 128, 0.1) 0%, transparent 100%);
            box-shadow: 0 4px 12px rgba(13, 70, 128, 0.2);
        }
        .btn-small { padding: 5px 10px; font-size: 12px; margin-left: 10px; }
        table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        th { background: #667eea; color: white; padding: 12px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f9f9f9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 style="font-size: 38px; font-weight: 900; letter-spacing: 4px; color: #0D4680; margin-bottom: 4px; text-align: center;">SCFF</h1>
            <p style="font-size: 14px; color: #555; margin-bottom: 2px; text-align: center;">Sistema Contábil Fiscal Financeiro</p>
            <p style="font-size: 16px; font-weight: bold; color: #333; text-align: center;">Dashboard Análise de Atendimentos</p>
        </div>

        <!-- FORMULÁRIO -->
        <div id="formSection" class="form-card">
            <h3>📁 Upload de Dados</h3>
            <form id="uploadForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Arquivo Excel (.xlsx)</label>
                        <input type="file" id="fileInput" accept=".xlsx" required>
                    </div>
                    <div class="form-group">
                        <label>Mês de Referência</label>
                        <select id="monthInput" required>
                            <option value="">-- Selecione um mês --</option>
                            <option value="Janeiro">Janeiro</option>
                            <option value="Fevereiro">Fevereiro</option>
                            <option value="Março">Março</option>
                            <option value="Abril">Abril</option>
                            <option value="Maio">Maio</option>
                            <option value="Junho">Junho</option>
                            <option value="Julho">Julho</option>
                            <option value="Agosto">Agosto</option>
                            <option value="Setembro">Setembro</option>
                            <option value="Outubro">Outubro</option>
                            <option value="Novembro">Novembro</option>
                            <option value="Dezembro">Dezembro</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Processar Dados</button>
            </form>
            <div id="formMessage"></div>

            <div class="historico-list" id="historicoSection" style="display: none;">
                <h3>📅 Análises Anteriores</h3>
                <div id="historicoList"></div>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboardSection" class="hidden">
            <button class="btn-back" onclick="voltarFormulario()">← Voltar</button>
            <div style="text-align: right; margin-bottom: 20px;">
                <button onclick="baixarPDF()" style="background: #2ed573; color: white; padding: 10px 20px;">📥 Baixar Relatório PDF</button>
            </div>
            <div id="dashboardContent"></div>
        </div>
    </div>

    <script>
        let historicoAnalises = JSON.parse(localStorage.getItem('historicoSCFF')) || [];

        const uploadForm = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const monthInput = document.getElementById('monthInput');
        const formSection = document.getElementById('formSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const dashboardContent = document.getElementById('dashboardContent');
        const formMessage = document.getElementById('formMessage');

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            formMessage.innerHTML = '';

            const file = fileInput.files[0];
            const month = monthInput.value.trim();

            if (!file || !month) {
                formMessage.innerHTML = '<div class="error">⚠️ Preencha todos os campos!</div>';
                return;
            }

            try {
                formMessage.innerHTML = '<div class="success">⏳ Processando...</div>';
                const arrayBuffer = await file.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(worksheet);

                if (jsonData.length === 0) throw new Error('Arquivo vazio');
                
                const stats = processarDados(jsonData, month);

                // Validar se dados foram processados corretamente antes de salvar
                if (stats.errors.length > 0 && stats.total === 0) {
                    const erroMsg = stats.errors.map(e => e.msg).join('<br><br>');
                    formMessage.innerHTML = `<div class="error">❌ Nenhum dado processado.<br><br>${erroMsg}</div>`;
                    return;
                }

                if (stats.total === 0) {
                    formMessage.innerHTML = `<div class="error">❌ Nenhum registro válido encontrado. Verifique se o arquivo contém colunas de Grupo, N1 e N2 preenchidas corretamente.</div>`;
                    return;
                }

                historicoAnalises.push({
                    id: Date.now(),
                    mes: month,
                    data: new Date().toLocaleDateString(),
                    stats: stats
                });
                localStorage.setItem('historicoSCFF', JSON.stringify(historicoAnalises));
                atualizarHistorico();

                formSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                mostrarDashboard(stats);
                formMessage.innerHTML = '';

            } catch (error) {
                formMessage.innerHTML = `<div class="error">❌ ${error.message}</div>`;
                console.error('Erro:', error);
            }
        });

        function normalize(text) {
            if (!text) return 'NÃO';
            const str = String(text).trim().toUpperCase();
            if (['SIM', 'YES', 'TRUE', '1', 'Y', 'X', '✓', 'V'].includes(str)) {
                return 'SIM';
            }
            return 'NÃO';
        }

        function normalizarTexto(str) {
            // Remove acentos e converte para maiúsculas para comparação
            return String(str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().trim();
        }

        function processarDados(jsonData, month) {
            const stats = {
                month: month,
                total: 0,
                n1: 0,
                n2: 0,
                conjunto: 0,
                byGroup: {},
                errors: []
            };

            if (jsonData.length === 0) return stats;

            // Remover linhas completamente vazias
            jsonData = jsonData.filter(row => Object.values(row).some(val => val !== null && val !== '' && val !== undefined));

            if (jsonData.length === 0) return stats;

            // sheet_to_json já usa a linha 1 do Excel como header e retorna os dados a partir do índice 0
            const colunas = Object.keys(jsonData[0]);

            console.log('Colunas encontradas:', colunas);
            console.log('Primeira linha de dados:', jsonData[0]);

            // --- DETECÇÃO DE COLUNA DE GRUPO ---
            // Termos aceitos para coluna de grupo (sem acentos para comparação segura)
            const termosGrupo = ['grupo', 'equipe', 'departamento', 'team', 'setor', 'categoria', 'nome do status', 'nome status'];

            let grupoCol = colunas.find(col => {
                const norm = normalizarTexto(col);
                return termosGrupo.some(t => norm.includes(normalizarTexto(t)));
            });

            // Fallback: primeira coluna do arquivo
            if (!grupoCol) {
                grupoCol = colunas[0];
                console.warn(`Coluna de grupo não encontrada pelos termos. Usando primeira coluna como fallback: "${grupoCol}"`);
            }

            // --- DETECÇÃO DE COLUNAS DE STATUS (N1 e N2) ---
            // Prioridade 1: colunas com "resolvido", "resolved", "n1", "n2", "status"
            let statusCols = colunas.filter(col => {
                if (col === grupoCol) return false;
                const norm = normalizarTexto(col);
                return norm.includes('resolvido') ||
                       norm.includes('resolved') ||
                       norm.includes('status') ||
                       norm.includes('aberto') ||
                       norm.includes('fechado') ||
                       /N[12]/.test(norm);
            });

            // Prioridade 2: qualquer coluna que não seja a de grupo
            if (statusCols.length < 2) {
                statusCols = colunas.filter(col => col !== grupoCol);
                console.warn(`Colunas de status não encontradas pelos termos. Usando todas as demais colunas: ${statusCols.join(', ')}`);
            }

            console.log('Coluna de grupo:', grupoCol);
            console.log('Colunas de status:', statusCols);

            if (!grupoCol) {
                stats.errors.push({ line: 0, msg: `Nenhuma coluna encontrada no arquivo. Verifique se o arquivo está correto.` });
                return stats;
            }

            if (statusCols.length < 2) {
                stats.errors.push({
                    line: 0,
                    msg: `São necessárias pelo menos 2 colunas de status (N1 e N2). Encontradas: ${statusCols.join(', ')}. Colunas disponíveis: ${colunas.join(', ')}`
                });
                return stats;
            }

            const colN1 = statusCols[0];
            const colN2 = statusCols[1];

            console.log(`Mapeamento: Grupo="${grupoCol}" | N1="${colN1}" | N2="${colN2}"`);

            // --- PROCESSAMENTO DAS LINHAS ---
            // idx começa em 0 pois sheet_to_json já eliminou a linha de header
            for (let idx = 0; idx < jsonData.length; idx++) {
                try {
                    const row = jsonData[idx];

                    let grupo = String(row[grupoCol] || '').trim();
                    if (!grupo) continue;

                    const val1 = String(row[colN1] || '').trim();
                    const val2 = String(row[colN2] || '').trim();

                    const n1 = normalize(val1);
                    const n2 = normalize(val2);

                    // Debug das primeiras 5 linhas
                    if (idx < 5) {
                        console.log(`[Linha ${idx + 2}] Grupo="${grupo}" | ${colN1}="${val1}"(→${n1}) | ${colN2}="${val2}"(→${n2})`);
                    }

                    let tipo = null;
                    if (n1 === 'SIM' && n2 === 'SIM') {
                        tipo = 'conjunto';
                    } else if (n1 === 'SIM') {
                        tipo = 'n1';
                    } else if (n2 === 'SIM') {
                        tipo = 'n2';
                    }
                    // Linhas com NÃO/NÃO são ignoradas (sem resolução registrada)

                    if (tipo) {
                        stats.total++;
                        stats[tipo]++;

                        if (!stats.byGroup[grupo]) {
                            stats.byGroup[grupo] = { n1: 0, n2: 0, conjunto: 0 };
                        }
                        stats.byGroup[grupo][tipo]++;
                    }
                } catch (e) {
                    stats.errors.push({ line: idx + 2, msg: e.message });
                }
            }

            console.log('Stats finais:', stats);
            return stats;
        }

        function mostrarDashboard(stats) {
            const n1Perc = stats.total > 0 ? ((stats.n1 / stats.total) * 100).toFixed(1) : 0;
            const n2Perc = stats.total > 0 ? ((stats.n2 / stats.total) * 100).toFixed(1) : 0;
            const conjuntoPerc = stats.total > 0 ? ((stats.conjunto / stats.total) * 100).toFixed(1) : 0;

            let html = `
                <div class="dashboard">
                    <h2>📈 Total de Atendimentos - ${stats.month}</h2>
                    <div class="stats">
                        <div class="stat-box">
                            <div class="stat-number">${stats.n1}</div>
                            <div class="stat-label">N1</div>
                            <div class="stat-percent">${n1Perc}%</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-number">${stats.n2}</div>
                            <div class="stat-label">N2</div>
                            <div class="stat-percent">${n2Perc}%</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-number">${stats.conjunto}</div>
                            <div class="stat-label">N1+N2</div>
                            <div class="stat-percent">${conjuntoPerc}%</div>
                        </div>
                    </div>
                </div>

                <div class="meta-section">
                    <h2>🎯 Definir Metas</h2>
                    <div class="meta-row">
                        <div>
                            <label>Meta N1 (%)</label>
                            <input type="number" class="meta-input" id="metaN1" value="50" min="0" max="100">
                        </div>
                        <div>
                            <label>Meta N2 (%)</label>
                            <input type="number" class="meta-input" id="metaN2" value="10" min="0" max="100">
                        </div>
                        <div>
                            <label>Meta N1+N2 (%)</label>
                            <input type="number" class="meta-input" id="metaConjunto" value="40" min="0" max="100">
                        </div>
                        <div>
                            <button onclick="compararMetas(${stats.n1}, ${stats.n2}, ${stats.conjunto}, ${stats.total})" class="btn-add">Comparar com Meta</button>
                        </div>
                    </div>
                    <div id="resultadoMeta"></div>
                </div>

                <div class="charts-container">
                    <div class="chart-box">
                        <h3>📊 Distribuição Global</h3>
                        <div class="chart-canvas-wrapper">
                            <canvas id="chartGlobal"></canvas>
                        </div>
                    </div>
                    <div class="chart-box">
                        <h3>📊 Por Grupo de Atendimento</h3>
                        <div class="chart-canvas-wrapper">
                            <canvas id="chartGrupos"></canvas>
                        </div>
                    </div>
                </div>

                <div id="chartEvolucao" class="hidden">
                    <div class="chart-box" style="height: auto; margin-bottom: 20px;">
                        <h3>📈 Evolução Mensal</h3>
                        <div style="position: relative; height: 400px;">
                            <canvas id="chartTendencia"></canvas>
                        </div>
                    </div>
                </div>

                <div class="dashboard">
                    <h2>📋 Detalhamento por Grupo</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Grupo</th>
                                <th style="text-align: center;">N1</th>
                                <th style="text-align: center;">N2</th>
                                <th style="text-align: center;">N1+N2</th>
                                <th style="text-align: center;">Total</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            let totalN1 = 0, totalN2 = 0, totalConjunto = 0, totalGeral = 0;

            Object.entries(stats.byGroup).forEach(([grupo, dados]) => {
                const total = dados.n1 + dados.n2 + dados.conjunto;
                totalN1 += dados.n1;
                totalN2 += dados.n2;
                totalConjunto += dados.conjunto;
                totalGeral += total;
                
                html += `
                    <tr>
                        <td><strong>${grupo}</strong></td>
                        <td style="text-align: center;">${dados.n1}</td>
                        <td style="text-align: center;">${dados.n2}</td>
                        <td style="text-align: center;">${dados.conjunto}</td>
                        <td style="text-align: center;"><strong>${total}</strong></td>
                    </tr>
                `;
            });

            html += `
                            <tr style="background: #667eea; color: white; font-weight: bold;">
                                <td>TOTAL</td>
                                <td style="text-align: center;">${totalN1}</td>
                                <td style="text-align: center;">${totalN2}</td>
                                <td style="text-align: center;">${totalConjunto}</td>
                                <td style="text-align: center;">${totalGeral}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;

            dashboardContent.innerHTML = html;
            
            setTimeout(() => {
                criarGraficoGlobal(stats);
                criarGraficoGrupos(stats);
                if (historicoAnalises.length > 1) {
                    criarGraficoEvolucao();
                }
            }, 100);
        }

        function compararMetas(n1Real, n2Real, conjuntoReal, total) {
            const metaN1 = parseFloat(document.getElementById('metaN1').value);
            const metaN2 = parseFloat(document.getElementById('metaN2').value);
            const metaConjunto = parseFloat(document.getElementById('metaConjunto').value);

            const percN1 = ((n1Real / total) * 100).toFixed(1);
            const percN2 = ((n2Real / total) * 100).toFixed(1);
            const percConjunto = ((conjuntoReal / total) * 100).toFixed(1);

            const verificarMeta = (realizado, meta) => {
                if (realizado >= meta) return { cor: 'verde', emoji: '✅', status: 'Atingido' };
                if (realizado >= meta * 0.9) return { cor: 'amarelo', emoji: '⚠️', status: 'Próximo' };
                return { cor: 'vermelho', emoji: '❌', status: 'Não Atingido' };
            };

            const resultN1 = verificarMeta(percN1, metaN1);
            const resultN2 = verificarMeta(percN2, metaN2);
            const resultConjunto = verificarMeta(percConjunto, metaConjunto);

            let html = `
                <div style="margin-top: 20px; padding: 20px; background: white; border-radius: 8px;">
                    <h3>📊 Resultado da Comparação</h3>
                    <table style="width: 100%; margin-top: 15px;">
                        <thead>
                            <tr style="background: #667eea; color: white;">
                                <th style="padding: 10px;">Tipo</th>
                                <th style="padding: 10px; text-align: center;">Meta</th>
                                <th style="padding: 10px; text-align: center;">Realizado</th>
                                <th style="padding: 10px; text-align: center;">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td style="padding: 10px;"><strong>N1</strong></td>
                                <td style="padding: 10px; text-align: center;">${metaN1}%</td>
                                <td style="padding: 10px; text-align: center;">${percN1}%</td>
                                <td style="padding: 10px; text-align: center;">
                                    <span class="indicador ${resultN1.cor}"></span>${resultN1.emoji} ${resultN1.status}
                                </td>
                            </tr>
                            <tr style="background: #f5f5f5;">
                                <td style="padding: 10px;"><strong>N2</strong></td>
                                <td style="padding: 10px; text-align: center;">${metaN2}%</td>
                                <td style="padding: 10px; text-align: center;">${percN2}%</td>
                                <td style="padding: 10px; text-align: center;">
                                    <span class="indicador ${resultN2.cor}"></span>${resultN2.emoji} ${resultN2.status}
                                </td>
                            </tr>
                            <tr>
                                <td style="padding: 10px;"><strong>N1+N2</strong></td>
                                <td style="padding: 10px; text-align: center;">${metaConjunto}%</td>
                                <td style="padding: 10px; text-align: center;">${percConjunto}%</td>
                                <td style="padding: 10px; text-align: center;">
                                    <span class="indicador ${resultConjunto.cor}"></span>${resultConjunto.emoji} ${resultConjunto.status}
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;

            document.getElementById('resultadoMeta').innerHTML = html;
        }

        function criarGraficoGlobal(stats) {
            const canvas = document.getElementById('chartGlobal');
            if (!canvas) return;

            new Chart(canvas, {
                type: 'doughnut',
                data: {
                    labels: ['N1', 'N2', 'N1+N2'],
                    datasets: [{
                        data: [stats.n1, stats.n2, stats.conjunto],
                        backgroundColor: ['#2ed573', '#ff9f43', '#667eea'],
                        borderColor: '#fff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percent = ((context.parsed / total) * 100).toFixed(1);
                                    return `${context.label}: ${context.parsed} (${percent}%)`;
                                }
                            }
                        }
                    }
                },
                plugins: [{
                    id: 'textCenter',
                    beforeDatasetsDraw(chart) {
                        const { width, height, ctx } = chart;
                        ctx.restore();
                        
                        const fontSize = (height / 200).toFixed(2);
                        ctx.font = `${fontSize}em sans-serif`;
                        ctx.textBaseline = 'middle';
                        
                        const text = `Total: ${stats.total}`;
                        const textX = Math.round((width - ctx.measureText(text).width) / 2);
                        const textY = height / 2;
                        
                        ctx.fillStyle = '#333';
                        ctx.font = 'bold 16px sans-serif';
                        ctx.fillText(text, textX, textY);
                        ctx.save();
                    }
                }]
            });
        }

        function criarGraficoGrupos(stats) {
            const canvas = document.getElementById('chartGrupos');
            if (!canvas) return;

            const grupos = Object.keys(stats.byGroup);
            const n1Data = grupos.map(g => stats.byGroup[g].n1);
            const n2Data = grupos.map(g => stats.byGroup[g].n2);
            const conjuntoData = grupos.map(g => stats.byGroup[g].conjunto);

            new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: grupos,
                    datasets: [
                        { label: 'N1', data: n1Data, backgroundColor: '#2ed573' },
                        { label: 'N2', data: n2Data, backgroundColor: '#ff9f43' },
                        { label: 'N1+N2', data: conjuntoData, backgroundColor: '#667eea' }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                },
                plugins: [{
                    id: 'customDataLabels',
                    afterDatasetsDraw(chart) {
                        const { ctx } = chart;
                        ctx.font = 'bold 9px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillStyle = '#000';

                        chart.data.datasets.forEach((dataset, datasetIndex) => {
                            const meta = chart.getDatasetMeta(datasetIndex);
                            
                            meta.data.forEach((datapoint, index) => {
                                const value = dataset.data[index];
                                
                                if (value > 0) {
                                    let totalGrupo = 0;
                                    chart.data.datasets.forEach(ds => {
                                        totalGrupo += ds.data[index] || 0;
                                    });
                                    
                                    const percentageGrupo = ((value / totalGrupo) * 100).toFixed(1);
                                    const { x, y } = datapoint.tooltipPosition();
                                    
                                    ctx.fillStyle = '#000';
                                    ctx.font = 'bold 9px Arial';
                                    ctx.fillText(`${value}`, x, y - 5);
                                    ctx.font = '8px Arial';
                                    ctx.fillText(`(${percentageGrupo}%)`, x, y + 5);
                                }
                            });
                        });
                    }
                }]
            });
        }

        function criarGraficoEvolucao() {
            const canvas = document.getElementById('chartTendencia');
            if (!canvas) return;

            document.getElementById('chartEvolucao').classList.remove('hidden');

            const meses = historicoAnalises.map(h => h.mes);
            const n1Values = historicoAnalises.map(h => h.stats.n1);
            const n2Values = historicoAnalises.map(h => h.stats.n2);
            const conjuntoValues = historicoAnalises.map(h => h.stats.conjunto);

            new Chart(canvas, {
                type: 'line',
                data: {
                    labels: meses,
                    datasets: [
                        {
                            label: 'N1',
                            data: n1Values,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            tension: 0.4,
                            fill: true
                        },
                        {
                            label: 'N2',
                            data: n2Values,
                            borderColor: '#ff9f43',
                            backgroundColor: 'rgba(255, 159, 67, 0.1)',
                            tension: 0.4,
                            fill: true
                        },
                        {
                            label: 'N1+N2',
                            data: conjuntoValues,
                            borderColor: '#2ed573',
                            backgroundColor: 'rgba(46, 213, 115, 0.1)',
                            tension: 0.4,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        function atualizarHistorico() {
            const historicoSection = document.getElementById('historicoSection');
            const historicoList = document.getElementById('historicoList');

            if (historicoAnalises.length > 0) {
                historicoSection.style.display = 'block';
                historicoList.innerHTML = historicoAnalises.map(item => `
                    <div class="historico-item">
                        <span>📅 ${item.mes} - ${item.data} (${item.stats.total} atendimentos)</span>
                        <div>
                            <button class="btn-small" onclick="carregarAnalise(${item.id})">Carregar</button>
                            <button class="btn-small" onclick="deletarAnalise(${item.id})" style="background: #f44;">Deletar</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        function carregarAnalise(id) {
            const analise = historicoAnalises.find(h => h.id === id);
            if (analise) {
                formSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                mostrarDashboard(analise.stats);
            }
        }

        function deletarAnalise(id) {
            if (confirm('Tem certeza que deseja deletar essa análise?')) {
                historicoAnalises = historicoAnalises.filter(h => h.id !== id);
                localStorage.setItem('historicoSCFF', JSON.stringify(historicoAnalises));
                atualizarHistorico();
            }
        }

        function baixarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');

            const pageWidth  = doc.internal.pageSize.getWidth();   // 210
            const pageHeight = doc.internal.pageSize.getHeight();  // 297
            const marginL = 15, marginR = 15;
            const contentW = pageWidth - marginL - marginR;        // 180

            // Pega a análise sendo visualizada (última salva)
            const analiseAtual = historicoAnalises[historicoAnalises.length - 1];
            const stats = analiseAtual.stats;

            const dataAtual  = new Date().toLocaleDateString('pt-BR');
            const n1Perc     = stats.total > 0 ? ((stats.n1       / stats.total) * 100).toFixed(1) : '0.0';
            const n2Perc     = stats.total > 0 ? ((stats.n2       / stats.total) * 100).toFixed(1) : '0.0';
            const conjPerc   = stats.total > 0 ? ((stats.conjunto / stats.total) * 100).toFixed(1) : '0.0';

            // ─────────────────────────────────────────────
            // HELPER: Adiciona rodapé em todas as páginas
            // ─────────────────────────────────────────────
            function adicionarRodape() {
                const totalPaginas = doc.internal.getNumberOfPages();
                for (let i = 1; i <= totalPaginas; i++) {
                    if (i === 1) continue; // Página 1 é a capa — tem seu próprio rodapé visual
                    doc.setPage(i);
                    // Linha separadora
                    doc.setDrawColor(200, 200, 200);
                    doc.setLineWidth(0.2);
                    doc.line(marginL, pageHeight - 14, pageWidth - marginR, pageHeight - 14);
                    doc.setFontSize(7.5);
                    doc.setTextColor(160, 160, 160);
                    doc.setFont(undefined, 'normal');
                    doc.text(
                        `© ${new Date().getFullYear()} SCFF - Sistema Contabil Fiscal Financeiro  |  Relatorio gerado automaticamente em ${dataAtual}`,
                        pageWidth / 2, pageHeight - 8, { align: 'center' }
                    );
                    doc.text(`Pagina ${i - 1} / ${totalPaginas - 1}`, pageWidth - marginR, pageHeight - 8, { align: 'right' });
                }
            }

            // ─────────────────────────────────────────────
            // HELPER: Título de seção com linha decorativa
            // ─────────────────────────────────────────────
            function tituloSecao(texto, y) {
                doc.setFontSize(11);
                doc.setTextColor(13, 70, 128);
                doc.setFont(undefined, 'bold');
                doc.text(texto.toUpperCase(), marginL, y);
                doc.setDrawColor(13, 70, 128);
                doc.setLineWidth(0.4);
                doc.line(marginL, y + 2, pageWidth - marginR, y + 2);
                doc.setLineWidth(0.2);
                doc.setFont(undefined, 'normal');
                return y + 9;
            }

            // ─────────────────────────────────────────────
            // HELPER: Verifica e adiciona nova página
            // ─────────────────────────────────────────────
            function checarPagina(y, espacoNecessario) {
                if (y + espacoNecessario > pageHeight - 22) {
                    doc.addPage();
                    return 18;
                }
                return y;
            }

            // ══════════════════════════════════════════════
            // PÁGINA 1 — CAPA
            // ══════════════════════════════════════════════

            // Fundo azul marinho na capa
            doc.setFillColor(13, 70, 128);
            doc.rect(0, 0, pageWidth, pageHeight, 'F');

            // Faixa decorativa central
            doc.setFillColor(26, 95, 160);
            doc.rect(0, pageHeight * 0.38, pageWidth, pageHeight * 0.30, 'F');

            // Linha decorativa superior da faixa
            doc.setFillColor(102, 126, 234);
            doc.rect(0, pageHeight * 0.38, pageWidth, 1.2, 'F');

            // Linha decorativa inferior da faixa
            doc.rect(0, pageHeight * 0.38 + pageHeight * 0.30 - 1.2, pageWidth, 1.2, 'F');

            // Logo / sigla
            doc.setFontSize(52);
            doc.setTextColor(255, 255, 255);
            doc.setFont(undefined, 'bold');
            doc.text('SCFF', pageWidth / 2, pageHeight * 0.30, { align: 'center' });

            // Nome do setor
            doc.setFontSize(12);
            doc.setFont(undefined, 'normal');
            doc.setTextColor(180, 210, 240);
            doc.text('Sistema Contabil Fiscal Financeiro', pageWidth / 2, pageHeight * 0.30 + 10, { align: 'center' });

            // Subtítulo
            doc.setFontSize(10);
            doc.setTextColor(140, 185, 225);
            doc.text('Dashboard Analise de Atendimentos', pageWidth / 2, pageHeight * 0.30 + 18, { align: 'center' });

            // Título principal
            doc.setFontSize(22);
            doc.setTextColor(255, 255, 255);
            doc.setFont(undefined, 'bold');
            doc.text('Relatorio de Atendimentos', pageWidth / 2, pageHeight * 0.46, { align: 'center' });

            // Mês em destaque
            doc.setFontSize(16);
            doc.setFont(undefined, 'normal');
            doc.setTextColor(180, 210, 240);
            doc.text(stats.month.toUpperCase(), pageWidth / 2, pageHeight * 0.46 + 11, { align: 'center' });

            // Total de atendimentos
            doc.setFontSize(11);
            doc.setTextColor(255, 255, 255);
            doc.text(`Total de Atendimentos: ${stats.total}`, pageWidth / 2, pageHeight * 0.46 + 22, { align: 'center' });

            // Data de geração
            doc.setFontSize(9);
            doc.setTextColor(160, 200, 230);
            doc.text(`Gerado em: ${dataAtual}`, pageWidth / 2, pageHeight * 0.84, { align: 'center' });

            // Barra inferior
            doc.setFillColor(102, 126, 234);
            doc.rect(0, pageHeight - 18, pageWidth, 18, 'F');
            doc.setFontSize(8);
            doc.setTextColor(220, 230, 255);
            doc.text('SCFF - Sistema Contabil Fiscal Financeiro', pageWidth / 2, pageHeight - 7, { align: 'center' });

            // ══════════════════════════════════════════════
            // PÁGINA 2 — RESUMO EXECUTIVO + GRÁFICOS
            // ══════════════════════════════════════════════
            doc.addPage();
            let y = 18;

            y = tituloSecao('Resumo Executivo', y);

            // Cards de resumo (4 cards lado a lado)
            const cards = [
                { label: 'N1',       valor: stats.n1,       perc: n1Perc,   cor: [46, 213, 115] },
                { label: 'N2',       valor: stats.n2,       perc: n2Perc,   cor: [255, 159, 67] },
                { label: 'N1 + N2',  valor: stats.conjunto, perc: conjPerc, cor: [102, 126, 234] },
                { label: 'TOTAL',    valor: stats.total,    perc: '100.0',  cor: [13, 70, 128] },
            ];

            const cardW   = (contentW - 9) / 4;  // 4 cards com gap de 3mm entre eles
            const cardH   = 26;
            const cardY   = y;

            cards.forEach((card, i) => {
                const cx = marginL + i * (cardW + 3);

                // Fundo do card
                doc.setFillColor(...card.cor);
                doc.roundedRect(cx, cardY, cardW, cardH, 2, 2, 'F');

                // Barra luminosa no topo
                doc.setFillColor(255, 255, 255);
                doc.setGState(new doc.GState({ opacity: 0.15 }));
                doc.roundedRect(cx, cardY, cardW, 4, 2, 2, 'F');
                doc.setGState(new doc.GState({ opacity: 1 }));

                // Valor principal
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(18);
                doc.setFont(undefined, 'bold');
                doc.text(String(card.valor), cx + cardW / 2, cardY + 12, { align: 'center' });

                // Label
                doc.setFontSize(7.5);
                doc.setFont(undefined, 'normal');
                doc.text(card.label, cx + cardW / 2, cardY + 18, { align: 'center' });

                // Percentual
                doc.setFontSize(8.5);
                doc.setFont(undefined, 'bold');
                doc.text(`${card.perc}%`, cx + cardW / 2, cardY + 23.5, { align: 'center' });
            });

            y = cardY + cardH + 12;

            // ── Gráficos lado a lado ──
            y = tituloSecao('Distribuicao e Atendimentos por Grupo', y);

            const chartGlobal = document.getElementById('chartGlobal');
            const chartGrupos = document.getElementById('chartGrupos');
            const grafH = 72;
            const halfW = (contentW - 5) / 2;

            if (chartGlobal) {
                try {
                    doc.addImage(chartGlobal.toDataURL('image/png'), 'PNG', marginL, y, halfW, grafH);
                } catch(e) { console.warn('Erro gráfico global', e); }
            }
            if (chartGrupos) {
                try {
                    doc.addImage(chartGrupos.toDataURL('image/png'), 'PNG', marginL + halfW + 5, y, halfW, grafH);
                } catch(e) { console.warn('Erro gráfico grupos', e); }
            }
            y += grafH + 12;

            // ── Evolução Mensal (se houver) ──
            if (historicoAnalises.length > 1) {
                y = checarPagina(y, 90);
                y = tituloSecao('Evolucao Mensal', y);
                const chartEvolucao = document.getElementById('chartTendencia');
                if (chartEvolucao) {
                    try {
                        doc.addImage(chartEvolucao.toDataURL('image/png'), 'PNG', marginL, y, contentW, 72);
                        y += 78;
                    } catch(e) { console.warn('Erro gráfico evolução', e); }
                }
            }

            // ══════════════════════════════════════════════
            // PÁGINA 3+ — TABELA DETALHAMENTO
            // ══════════════════════════════════════════════
            y = checarPagina(y, 60);
            if (y < 18) y = 18;
            y = tituloSecao('Detalhamento por Grupo', y);

            // Montar dados da tabela a partir dos stats (não do DOM)
            const grupos = Object.keys(stats.byGroup);
            const tabelaHeaders = ['Grupo', 'N1', 'N2', 'N1+N2', 'Total'];
            const tabelaRows = grupos.map(g => {
                const d = stats.byGroup[g];
                const tot = d.n1 + d.n2 + d.conjunto;
                return [g, String(d.n1), String(d.n2), String(d.conjunto), String(tot)];
            });
            tabelaRows.push(['TOTAL', String(stats.n1), String(stats.n2), String(stats.conjunto), String(stats.total)]);

            const colW = [78, 24, 24, 24, 21];  // soma = 171mm — cabe em 180 com folga
            const rowH = 8;

            // ── Função auxiliar: desenha uma linha da tabela ──
            function desenharLinha(rowData, yLinha, isHeader, isTotal, isOdd) {
                let xp = marginL;
                rowData.forEach((cell, ci) => {
                    // Definir cores de fundo explicitamente para cada célula
                    if (isHeader || isTotal) {
                        doc.setFillColor(13, 70, 128);
                    } else if (isOdd) {
                        doc.setFillColor(235, 242, 255);
                    } else {
                        doc.setFillColor(255, 255, 255);
                    }

                    // 1. Desenhar fundo (fill)
                    doc.rect(xp, yLinha, colW[ci], rowH, 'F');

                    // 2. Desenhar borda (stroke) — separado para não interferir no fill
                    doc.setDrawColor(190, 200, 220);
                    doc.setLineWidth(0.1);
                    doc.rect(xp, yLinha, colW[ci], rowH, 'S');

                    // 3. Texto com cores explícitas
                    if (isHeader || isTotal) {
                        doc.setTextColor(255, 255, 255);
                        doc.setFont(undefined, 'bold');
                    } else {
                        doc.setTextColor(40, 40, 40);
                        doc.setFont(undefined, ci === 0 ? 'normal' : 'normal');
                    }

                    doc.setFontSize(8.5);
                    const align = ci === 0 ? 'left' : 'center';
                    const tx    = ci === 0 ? xp + 3  : xp + colW[ci] / 2;
                    doc.text(String(cell).trim(), tx, yLinha + 5.2, { align, maxWidth: colW[ci] - 4 });

                    xp += colW[ci];
                });
            }

            // ── Header ──
            desenharLinha(tabelaHeaders, y, true, false, false);
            y += rowH;

            // ── Linhas de dados ──
            tabelaRows.forEach((row, ri) => {
                y = checarPagina(y, rowH + 2);
                // Se mudou de página, redesenhar o header
                if (y === 18) {
                    desenharLinha(tabelaHeaders, y, true, false, false);
                    y += rowH;
                }
                const isTotal = row[0] === 'TOTAL';
                const isOdd   = ri % 2 !== 0;  // zebra: linhas ímpares com azul claro
                desenharLinha(row, y, false, isTotal, isOdd);
                y += rowH;
            });

            // ── Aplica rodapé em todas as páginas ──
            adicionarRodape();

            // ── Salva com nome dinâmico ──
            const nomeMes = stats.month.toLowerCase().replace(/\s+/g, '_');
            doc.save(`relatorio_scff_${nomeMes}.pdf`);
        }

        function voltarFormulario() {
            dashboardSection.classList.add('hidden');
            formSection.classList.remove('hidden');
            uploadForm.reset();
            formMessage.innerHTML = '';
        }

        atualizarHistorico();
    </script>
